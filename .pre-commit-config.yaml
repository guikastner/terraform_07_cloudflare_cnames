# Instalação: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt -check -diff -recursive
        language: system
        pass_filenames: false
        files: \.(tf|tfvars)$
      - id: block-tfvars
        name: bloqueia terraform.tfvars e state
        entry: "Arquivos com segredos/state não devem ser commitados"
        language: fail
        files: (^|/)(terraform\.tfvars|dns\.json|.*\.auto\.tfvars(\.json)?|.*\.tfstate(\..*)?)$
        exclude: \.example$
